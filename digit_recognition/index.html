<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digit Recognizer · Sooraj Abraham</title>
  <meta name="description" content="Draw a digit and a CNN trained on MNIST predicts it, live in your browser with TensorFlow.js." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style.css" />
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <style>
    .app { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: start; }
    .pad {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px;
      display: flex; flex-direction: column; gap: 14px; width: min(100%, 424px);
    }
    #canvas {
      width: 100%; aspect-ratio: 1; border-radius: 14px; touch-action: none; cursor: crosshair;
      background-color: #0e1017;
      background-image: radial-gradient(circle, #232838 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .pad .btn-row { justify-content: space-between; }
    .pad .btn { flex: 1; justify-content: center; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
    .result { display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px; }
    .result .big { font-size: 5rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--accent-2); min-width: 1ch; }
    .result .sub { color: var(--muted); }
    .bars { display: grid; gap: 7px; }
    .bar { display: grid; grid-template-columns: 18px 1fr 48px; gap: 10px; align-items: center; font-family: "JetBrains Mono", monospace; font-size: .82rem; color: var(--muted); }
    .bar .track { height: 10px; border-radius: 6px; background: var(--bg-elev); border: 1px solid var(--border); overflow: hidden; }
    .bar .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .35s ease; }
    .bar.top { color: var(--text); font-weight: 500; }
    .status { font-size: .85rem; color: var(--muted); font-family: "JetBrains Mono", monospace; }
    .page-head { padding: 56px 0 28px; }
    .page-head h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.035em; margin: 10px 0 8px; }
    .page-head p { color: var(--muted); margin: 0; max-width: 620px; }
    @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .pad { margin: 0 auto; } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container">
      <a href="../index.html" class="brand">sooraj<span>.</span>ai</a>
      <nav class="nav-links">
        <a href="../index.html#projects">Projects</a>
        <a href="../index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <a href="../index.html" class="kicker">← back to portfolio</a>
      <h1>Draw a <span class="gradient-text">digit</span></h1>
      <p>A convolutional network trained on MNIST, running entirely in your browser with TensorFlow.js. Draw a single number from 0–9, large and centred, then hit predict.</p>
    </div>

    <div class="app">
      <div class="pad">
        <!-- Internal resolution kept at 386×386; the model downsamples it to 28×28 -->
        <canvas id="canvas" width="386" height="386" aria-label="Drawing area"></canvas>
        <div class="btn-row">
          <button type="button" class="btn primary" id="predict-btn" onclick="predictModel()">Predict</button>
          <button type="button" class="btn" onclick="erase()">Clear</button>
        </div>
        <div class="status" id="status">Loading model…</div>
      </div>

      <div class="panel">
        <div class="result">
          <div class="big" id="result">–</div>
          <div class="sub" id="confidence">Draw something to get a prediction</div>
        </div>
        <div class="bars" id="bars"></div>
      </div>
    </div>
    <div style="height:72px"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.7.0"></script>
  <script src="script.js"></script>
</body>
</html>
